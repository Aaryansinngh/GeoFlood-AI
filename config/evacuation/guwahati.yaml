      - id: "DFO_4288"
        path: "data/raw/DFO_4288_From_20150813_to_20150911.tif"
        date: "2015-08"

  risk:
    source: "historical_and_terrain_proxy"
    probability_available: false
    historical_band: 1
    duration_band: 2
    clear_views_band: 3
    clear_percentage_band: 4
    permanent_water_band: 5

  routing:
    network_type: "drive"
    default_speed_kmph: 30
    risk_lambda: 10
