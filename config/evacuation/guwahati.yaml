  centre:
    latitude: 26.1445
    longitude: 91.7362

  radius_m: 5000

  crs:
    geographic: "EPSG:4326"
    projected: "EPSG:32646"

  data:
    dem: "data/raw/srtm_dem_study_area.tif"

    historical_flood_events:
      - id: "DFO_4259"
        path: "data/raw/DFO_4259_From_20150602_to_20150629.tif"
